name: Vercel Auto-Deploy Check

# Este workflow verifica que Vercel esté conectado y despliegue automáticamente
# No requiere secrets de GitHub si Vercel está conectado directamente al repositorio

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub Actions

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Vercel Auto-Deploy
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Verificando conexión automática de Vercel"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "✅ Push detectado en la rama main"
          echo ""
          echo "💡 Si Vercel está conectado correctamente a este repositorio,"
          echo "   el deployment debería iniciarse automáticamente."
          echo ""
          echo "📋 Para verificar la conexión:"
          echo "   1. Ve a: https://vercel.com/dashboard"
          echo "   2. Selecciona tu proyecto"
          echo "   3. Ve a: Settings → Git"
          echo "   4. Verifica que el repositorio 'OrihuelaAraiza/Klinia_Platform' esté conectado"
          echo "   5. Verifica que la rama de producción sea 'main'"
          echo ""
          echo "🔗 Enlace directo al proyecto:"
          echo "   https://vercel.com/dashboard"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Información del commit:"
          echo "   Commit: ${{ github.sha }}"
          echo "   Mensaje: ${{ github.event.head_commit.message }}"
          echo "   Autor: ${{ github.event.head_commit.author.name }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Optional - Trigger via API (si hay secrets configurados)
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_PROJECT_ID != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "🚀 Secrets detectados - Disparando deployment adicional vía API..."
          curl -X POST "https://api.vercel.com/v13/deployments?projectId=${VERCEL_PROJECT_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"name":"triggered-by-github-action"}' && \
          echo "✅ Deployment adicional iniciado" || \
          echo "⚠️  API call falló, pero Vercel debería detectar el push automáticamente"
